# French. NOTE: a native speaker needs to check these messages and their
# expected results before this file's score is trusted (see evals/README note
# in the PR / results report).
- message: "Deux butter chicken et un naan, s'il vous plaît"
  expected:
    intent: order
    items:
      - id: butter-chicken
        quantity: 2
      - id: garlic-naan
        quantity: 1
- message: "Je voudrais un chicken biryani"

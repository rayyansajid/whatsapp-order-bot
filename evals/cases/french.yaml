    intent: order
    items:
      - id: chana-masala
        quantity: 1
      - id: basmati-rice
        quantity: 1
      - id: raita
        quantity: 1
- message: "C'est tout pour moi, merci"
  expected:
    intent: finish
    items: []
- message: "Je n'ai besoin de rien d'autre"
  expected:
    intent: finish
    items: []
- message: "À quelle heure ouvrez-vous ?"
  expected:
    intent: question
    items: []
- message: "Quels sont les frais de livraison ?"
  expected:

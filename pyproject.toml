[project]
name = "orderbot"
version = "0.1.0"
description = "WhatsApp ordering bot demo for a fictional restaurant"
readme = "README.md"
authors = [
    { name = "Rayyan Sajid", email = "rayyans898@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

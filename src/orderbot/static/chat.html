<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saffron Lane Kitchen · Chat</title>
<style>
  :root { --bg: #efe7dc; --panel: #fff; --me: #d9fdd3; --bot: #fff; --ink: #1f1a14;
          --muted: #7a6a5a; --accent: #b4531f; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink);
         height: 100dvh; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 560px; display: flex; flex-direction: column; height: 100%; }
  header { background: var(--accent); color: #fff; padding: 14px 16px; }
  header h1 { margin: 0; font-size: 1.05rem; }
  header p { margin: 2px 0 0; font-size: 0.8rem; opacity: 0.85; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap;
         line-height: 1.4; box-shadow: 0 1px 1px rgba(0,0,0,.08); font-size: 0.95rem; }
  .me { align-self: flex-end; background: var(--me); }
  .bot { align-self: flex-start; background: var(--bot); }
  form { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); }
  input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 20px; font: inherit; }
  button { padding: 10px 16px; border: 0; border-radius: 20px; background: var(--accent);
           color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: 0.6; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Saffron Lane Kitchen</h1>
    <p>Demo ordering bot · fictional restaurant</p>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="text" autocomplete="off" placeholder="Type a message (try “menu”)" required>
    <button id="send">Send</button>
  </form>
</div>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("text");
  const send = document.getElementById("send");

  let sessionId;
  try { sessionId = localStorage.getItem("orderbot-session"); } catch (e) {}
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    try { localStorage.setItem("orderbot-session", sessionId); } catch (e) {}
  }

  // Render WhatsApp-style *bold* and _italic_ safely (text nodes only, no innerHTML).
  function render(el, text) {
    const parts = text.split(/(\*[^*\n]+\*|_[^_\n]+_)/g);
    for (const part of parts) {
      if (/^\*[^*]+\*$/.test(part)) {
        el.appendChild(document.createElement("b")).textContent = part.slice(1, -1);
      } else if (/^_[^_]+_$/.test(part)) {
        el.appendChild(document.createElement("i")).textContent = part.slice(1, -1);
      } else {
        el.appendChild(document.createTextNode(part));
      }
    }
  }

  function add(text, who) {
    const el = document.createElement("div");
    el.className = "msg " + who;
    render(el, text);
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  async function sendMessage(message) {
    send.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message }),
      });
      const data = await res.json();
      add(res.ok ? data.reply : "Something went wrong. Please try again.", "bot");
    } catch (e) {
      add("Couldn't reach the server. Please try again.", "bot");
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    add(message, "me");
    input.value = "";
    sendMessage(message);
  });

  sendMessage("hi");
</script>
</body>
</html>
